// --- DATABASE INDEXEDDB ---
const DB_NAME = 'PlaybookMediaDB_V2';
const DB_STORE = 'media_files';

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(DB_STORE)){
        db.createObjectStore(DB_STORE);
      }
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}

async function getMediaDB(id){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(id);
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function addMediaDB(id, newFiles){
  const existingFiles = await getMediaDB(id);
  const updatedList = [...existingFiles, ...newFiles];
  
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(updatedList, id);
    tx.oncomplete = () => resolve(updatedList);
    tx.onerror = () => reject(tx.error);
  });
}

async function deleteSingleMediaDB(id, mediaIndex){
  const existingFiles = await getMediaDB(id);
  existingFiles.splice(mediaIndex, 1);
  
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(existingFiles, id);
    tx.oncomplete = () => resolve(existingFiles);
    tx.onerror = () => reject(tx.error);
  });
}

async function deleteAllMediaDB(id){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function uid(){ return 'k' + Date.now() + Math.random().toString(36).slice(2,7); }

function loadItems(){
  // Mode read-only: selalu tampilkan data resmi dari SEED, tidak membaca/menyimpan ke localStorage
  allItems = SEED.map(s => ({...s}));
  render();
}

function computeStageMap(items){
  const order = ['Edukasi','Storing','Towing'];
  const groups = {};
  items.forEach(it=>{
    if(!groups[it.kendala]) groups[it.kendala] = new Set();
    groups[it.kendala].add(it.kategori);
  });
  const map = {};
  Object.keys(groups).forEach(k=>{
    const present = order.filter(o => groups[k].has(o));
    const m = {};
    present.forEach((cat, idx) => { m[cat] = idx + 1; });
    map[k] = m;
  });
  return map;
}

function stageLabel(item, stageMap){
  const m = stageMap[item.kendala];
  const num = m ? m[item.kategori] : 1;
  return 'Tahap ' + (num || 1);
}

function matchesFilter(item){
  if(currentFilter !== 'all' && item.kategori !== currentFilter) return false;
  if(currentSearch){
    const s = currentSearch.toLowerCase();
    return item.kendala.toLowerCase().includes(s) || (item.sistem||'').toLowerCase().includes(s) || (item.explain||'').toLowerCase().includes(s);
  }
  return true;
}

// Fungsi helper Copy ke Clipboard
function copyToClipboard(text, btnElement){
  if(!text){
    alert('Tidak ada teks untuk disalin.');
    return;
  }
  navigator.clipboard.writeText(text).then(()=>{
    const originalText = btnElement.textContent;
    btnElement.textContent = '✓ Copied!';
    btnElement.classList.add('copied');
    setTimeout(()=>{
      btnElement.textContent = originalText;
      btnElement.classList.remove('copied');
    }, 2000);
  }).catch(err => {
    alert('Gagal menyalin teks: ' + err);
  });
}

function render(){
  const listEl = document.getElementById('list');
  const filtered = allItems.filter(matchesFilter);
  const stageMap = computeStageMap(allItems);
  document.getElementById('countPill').textContent = filtered.length + ' dari ' + allItems.length + ' kendala';
  document.getElementById('emptyMsg').style.display = filtered.length ? 'none' : 'block';
  listEl.innerHTML = '';
  
  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card ' + item.kategori;
    card.dataset.id = item.id;
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-title">${escapeHtml(item.kendala)}</div>
          <div class="sistem-tag">${stageLabel(item, stageMap)}</div>
        </div>
        <div class="badge ${item.kategori}">${item.kategori}</div>
      </div>
      
      <div class="section-header">
        <div class="explain-lbl">Explanation</div>
        <button class="copy-btn" data-copy="explain">📋 Copy Text</button>
      </div>
      <textarea class="explain-textarea" data-field="explain" readonly>${escapeHtml(item.explain||'')}</textarea>
      
      ${item.kategori === 'Edukasi' ? `
      <div class="edu-box">
        <div class="section-header">
          <div class="explain-lbl">Template Edukasi</div>
          <button class="copy-btn" data-copy="edu">📋 Copy Text</button>
        </div>
        <textarea data-field="edu" readonly>${escapeHtml(item.edu||'')}</textarea>
      </div>` : ''}
      
      <div class="media-grid-container"></div>
    `;
    listEl.appendChild(card);
    
    // Render Galeri Media
    loadMediaGallery(item.id, card.querySelector('.media-grid-container'));

    const explainInput = card.querySelector('[data-field="explain"]');
    const eduInput = card.querySelector('[data-field="edu"]');

    // Event Listener Tombol Copy (satu-satunya aksi yang tersedia)
    card.querySelectorAll('[data-copy]').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetType = btn.dataset.copy;
        const textToCopy = targetType === 'explain' ? explainInput.value : (eduInput ? eduInput.value : '');
        copyToClipboard(textToCopy, btn);
      });
    });
  });
}

async function loadMediaGallery(id, containerEl){
  try{
    const fileList = await getMediaDB(id);
    renderGallery(id, fileList, containerEl);
  }catch(e){ console.error(e); }
}

function renderGallery(id, fileList, containerEl){
  containerEl.innerHTML = '';
  const staticFiles = STATIC_MEDIA[id] || [];
  if((!staticFiles || !staticFiles.length) && (!fileList || !fileList.length)) return;

  const grid = document.createElement('div');
  grid.className = 'media-grid';

  // Media bawaan (statis dari folder /media, tampil untuk semua pengunjung)
  staticFiles.forEach((path) => {
    const itemEl = document.createElement('div');
    itemEl.className = 'media-item';
    const isVideo = /\.(mp4|webm|mov|ogg)$/i.test(path);
    const mediaHtml = isVideo
      ? `<video controls src="${path}"></video>`
      : `<img src="${path}">`;
    itemEl.innerHTML = mediaHtml;
    grid.appendChild(itemEl);
  });

  // Media tambahan (dari data lama di browser ini, ditampilkan saja tanpa opsi hapus)
  (fileList || []).forEach((fileBlob) => {
    const itemEl = document.createElement('div');
    itemEl.className = 'media-item';
    const url = URL.createObjectURL(fileBlob);

    const mediaHtml = fileBlob.type.startsWith('video/')
      ? `<video controls src="${url}"></video>`
      : `<img src="${url}">`;

    itemEl.innerHTML = mediaHtml;
    grid.appendChild(itemEl);
  });

  containerEl.appendChild(grid);
}

async function handleMediaUpload(files, id, containerEl){
  try{
    const updatedList = await addMediaDB(id, files);
    renderGallery(id, updatedList, containerEl);
  }catch(e){
    alert('Gagal mengunggah media: ' + e.message);
  }
}

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// ---------- Toolbar events ----------
document.getElementById('searchBox').addEventListener('input', (e)=>{
  currentSearch = e.target.value.trim();
  render();
});
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.f;
    render();
  });
});
